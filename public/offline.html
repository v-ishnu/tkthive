<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Internet</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f8f9fb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #lottie {
      width: 220px;
      height: 220px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    p {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 30px;
      max-width: 400px;
      line-height: 1.6;
    }

    button {
      padding: 10px 26px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      border: 1px solid #1a73e8;
      background: transparent;
      color: #1a73e8;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #1a73e8;
      color: #ffffff;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div id="lottie"></div>

  <h1>No Internet Connection</h1>
  <p>Please check your network connection and try again.</p>

  <button onclick="retryConnection()">Retry</button>

  <script src="lottie.min.js"></script>

  <script>
    lottie.loadAnimation({
      container: document.getElementById('lottie'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'no-connection.json'
    });

    function retryConnection() {
      location.reload();
    }
  </script>

</body>
</html>
